<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://*.supabase.co https://images.unsplash.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai ws://localhost:* http://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google" content="notranslate" />
    <title>Nexus POS Pro</title>
    <meta name="description" content="Système de point de vente professionnel hors-ligne (PC, Android & iPhone)" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus POS Pro" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('nexus-pos-theme-v3') || 'light';
          document.documentElement.classList.remove('light', 'dark', 'emerald', 'gold', 'nardo-grey-racing');
          if (t === 'light') {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            if (t === 'emerald') document.documentElement.classList.add('emerald');
            else if (t === 'gold') document.documentElement.classList.add('gold');
            else if (t === 'nardo') document.documentElement.classList.add('nardo-grey-racing');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" class="notranslate"></div>
    <div id="debug-error" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; color:red; padding:20px; z-index:9999; overflow:auto; font-family:monospace;">
      <h1>Runtime Error Caught:</h1>
      <pre id="error-message"></pre>
      <button onclick="location.reload()" style="padding:10px; margin-top:20px;">Reload Page</button>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var str = String(msg).toLowerCase();
        if (str.indexOf('failed to fetch') > -1 || str.indexOf('load failed') > -1 || str.indexOf('networkerror') > -1 || str.indexOf('supabase') > -1) {
          console.warn('[Error ignored] Network/Supabase issue:', msg);
          return true;
        }
        document.getElementById('debug-error').style.display = 'block';
        document.getElementById('error-message').textContent = 
          msg + '\nat ' + url + ':' + line + ':' + col + '\n\n' + (error ? error.stack : '');
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason && (event.reason.message || String(event.reason)) || '';
        var reasonStr = String(reason).toLowerCase();
        if (
          reasonStr.indexOf('websocket') > -1 || 
          reasonStr.indexOf('failed to fetch') > -1 || 
          reasonStr.indexOf('load failed') > -1 || 
          reasonStr.indexOf('networkerror') > -1 || 
          reasonStr.indexOf('supabase') > -1 ||
          reasonStr.indexOf('fetch') > -1 ||
          reasonStr.indexOf('net::') > -1
        ) {
          console.warn('[Unhandled Rejection ignored] Benign or Network/Supabase issue:', reason);
          return;
        }
        document.getElementById('debug-error').style.display = 'block';
        document.getElementById('error-message').textContent = 
          'Unhandled Rejection: ' + reason + '\n\n' + (event.reason && event.reason.stack ? event.reason.stack : '');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
