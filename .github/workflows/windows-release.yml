name: Build & Attach Windows EXE & Android APK to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows EXE & Electron Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Quality (Typecheck & Vitest Tests)
        run: |
          npm run lint
          npm test

      - name: Build Web Application & Node Server
        run: npm run build

      - name: Package Windows Installer (.exe) with Electron Builder
        run: npx electron-builder --win --x64 --publish never

      - name: Extract Project Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Nexus POS Pro v$VERSION"

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          name: "Nexus POS Pro v${{ steps.get_version.outputs.VERSION }} (Production Release)"
          files: |
            release/*-Setup.exe
            release/*.apk
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
